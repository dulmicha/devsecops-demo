name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-format:
    name: Linting & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  sca-dependencies:
    name: SCA & Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install pip-audit
          pip-audit .

  test-and-coverage:
    name: Automated Testing & Coverage (pytest >= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-cov httpx .
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  container-security:
    name: Dockerfile Config & Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan Dockerfile and IaC Misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Build Local Image
        run: docker build -t security-api:${{ github.sha }} .
      - name: Scan Built Image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "security-api:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  quality-gate:
    name: Quality Gate Summary
    needs: [lint-and-format, secrets-scan, sast, sca-dependencies, test-and-coverage, container-security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Quality Gate Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::QUALITY GATE FAILED. One or more upstream security or testing jobs did not pass."
          exit 1

      - name: Gate Passed
        run: echo "QUALITY GATE PASSED. All checks passed."
