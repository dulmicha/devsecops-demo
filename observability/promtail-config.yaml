server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fastapi-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(security-findings-api|devsecops-demo-app-1|app)'
        action: keep
      - target_label: 'job'
        replacement: 'fastapi-app'
    pipeline_stages:
      # extract inner log string from Docker json-file wrapper
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      # parse structurred fields from the inner application JSON log
      - json:
          expressions:
            level: level
            request_id: request_id
            http_method: http_method
            http_path: http_path
            status_code: status_code
          source: output
      # normalize log level to uppercase and fallback to INFO for standard startup lines
      - template:
          source: level
          template: '{{ if .Value }}{{ ToUpper .Value }}{{ else }}INFO{{ end }}'
      # promote extracted attributes to searchable Loki labels
      - labels:
          level:
          request_id:
          http_method:
          status_code:
      # output clean inner application log
      - output:
          source: output
